<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loquesiento</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">

    <style>
        /* CSS - Estilização e Animações */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Container para o Parallax (Base) */
        #background-container {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            z-index: -1;
            overflow: hidden;
        }
        
        /* A imagem real dentro do container - TEMA PADRÃO (ORIGINAL) */
        #background-image {
            width: 100%;
            height: 100%;
            background-image: url('https://xatimg.com/image/u1KlkAc0rjf1.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            filter: none; 
            transition: transform 0.2s ease-out, background-image 0.2s ease-in-out, filter 0.2s ease-in-out;
        }

        /* Classe para o TEMA HOVER (ULTIMA IMAGEM) */
        .theme-hover {
            /* A imagem mais recente que aparece ao passar o mouse */
            background-image: url('https://xatimg.com/image/H0Pg9bpiICuN.png') !important;
            filter: none !important;
        }
        
        .main-text {
            font-family: 'Pirata One', cursive;
            font-size: 13.5vw; 
            color: #62d44f; 
            cursor: pointer;
            user-select: none;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 0, 0, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        .particle {
            position: absolute;
            width: 50px;
            height: auto;
            pointer-events: none;
            z-index: 100;
            animation: explode 1.2s ease-out forwards;
        }

        /* Animação de flutuação para o texto */
        @keyframes float {
            0% { transform: translateY(0px) rotateZ(0deg); }
            50% { transform: translateY(-20px) rotateZ(1.5deg); }
            100% { transform: translateY(0px) rotateZ(0deg); }
        }

        /* Animação de explosão para as partículas */
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { 
                transform: translate(var(--tx), var(--ty)) scale(0); 
                opacity: 0; 
            }
        }

        /* Estilo para o botão de play/pause no rodapé à direita (sem miniatura visível) */
        #music-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: background 0.3s ease, transform 0.2s ease;
            color: #62d44f;
            font-size: 24px;
        }

        #music-button:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
        }

        #music-button.play::before {
            content: '▶'; /* Ícone de play */
        }

        #music-button.pause::before {
            content: '⏸'; /* Ícone de pause */
        }

        /* Player invisível (áudio-only, sem vídeo/miniatura) */
        #youtube-player {
            position: absolute;
            top: -9999px; /* Fora da tela para esconder */
            left: -9999px;
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* Estilo para indicador de loading/error (opcional, escondido por padrão) */
        #player-status {
            position: fixed;
            bottom: 20px;
            right: 90px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="background-container">
        <div id="background-image"></div>
    </div>
    
    <h1 class="main-text" id="mainText">Loquesiento</h1>

    <!-- Indicador de status do player (opcional, para debug) -->
    <div id="player-status"></div>

    <!-- Botão de play/pause no rodapé à direita -->
    <button id="music-button" class="play"></button>

    <!-- Player do YouTube invisível (áudio-only) -->
    <div id="youtube-player"></div>
    
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // JavaScript - Interatividade (incluindo controle do player de música)

        let player; // Variável global para o player do YouTube
        let playerReady = false; // Flag para verificar se o player está pronto

        // --- INICIALIZAÇÃO DO PLAYER DO YOUTUBE (DEFINIDA FORA DO DOMCONTENTLOADED PARA EVITAR PROBLEMAS DE TIMING) ---
        // Função chamada pela API do YouTube quando o script carrega (definida globalmente)
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtube-player', {
                height: '0', // Invisível
                width: '0',  // Invisível
                videoId: 'l08Zw-RY__Q', // ID do vídeo
                playerVars: {
                    'list': 'RDl08Zw-RY__Q', // Playlist
                    'start': 0, // Inicia do começo (start_radio=1 é simulado pela playlist)
                    'controls': 0, // Sem controles visíveis (já que é invisível)
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'iv_load_policy': 3,
                    'enablejsapi': 1,
                    'playsinline': 1, // Para mobile
                    'autoplay': 0 // Não autoplay inicial
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError // Adicionado para lidar com erros
                }
            });
        };

        function onPlayerReady(event) {
            playerReady = true;
            console.log('Player pronto');
            updateStatus('Player carregado com sucesso!'); // Opcional: remove se não quiser debug
        }

        function onPlayerStateChange(event) {
            // Atualiza o botão baseado no estado do player
            if (event.data == YT.PlayerState.PLAYING) {
                document.getElementById('music-button').classList.remove('play');
                document.getElementById('music-button').classList.add('pause');
                updateStatus(''); // Limpa status
            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                document.getElementById('music-button').classList.remove('pause');
                document.getElementById('music-button').classList.add('play');
                updateStatus(''); // Limpa status
            }
        }

        function onPlayerError(event) {
            console.error('Erro no player:', event.data);
            playerReady = false;
            updateStatus('Erro ao carregar o player. Tente recarregar a página.');
        }

        // Função auxiliar para atualizar status (opcional, para debug)
        function updateStatus(message) {
            const statusEl = document.getElementById('player-status');
            if (message) {
                statusEl.textContent = message;
                statusEl.style.display = 'block';
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 3000);
            } else {
                statusEl.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const mainText = document.getElementById('mainText');
            const backgroundImage = document.getElementById('background-image');
            const musicButton = document.getElementById('music-button');
            
            // --- 1. EFEITO PARALLAX DO FUNDO ---
            const parallaxRange = 25; 

            window.addEventListener('mousemove', (e) => {
                const mouseX = (e.clientX / window.innerWidth) - 0.5;
                const mouseY = (e.clientY / window.innerHeight) - 0.5;
                const offsetX = -mouseX * parallaxRange;
                const offsetY = -mouseY * parallaxRange;

                backgroundImage.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            });


            // --- 2. EFEITO DE EXPLOSÃO DE PARTÍCULAS ---
            const particleImageUrl = 'https://upload.wikimedia.org/wikipedia/commons/b/bb/Blohsh.png';
            const explosionStrength = 250; 

            mainText.addEventListener('mousemove', (event) => {
                const mouseX = event.clientX; 
                const mouseY = event.clientY;

                if (Math.random() < 0.3) {
                    createParticle(mouseX, mouseY);
                }
            });
            
            function createParticle(x, y) {
                const particle = document.createElement('img');
                particle.src = particleImageUrl;
                particle.classList.add('particle');
                
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                const randomAngle = Math.random() * Math.PI * 2;
                const randomDistance = Math.random() * explosionStrength;
                
                const finalX = Math.cos(randomAngle) * randomDistance;
                const finalY = Math.sin(randomAngle) * randomDistance;

                particle.style.setProperty('--tx', `${finalX}px`);
                particle.style.setProperty('--ty', `${finalY}px`);
                document.body.appendChild(particle);

                particle.addEventListener('animationend', () => {
                    particle.remove();
                });
            }
            
            
            // --- 3. TROCA DE TEMA AO PASSAR O MOUSE ---
            
            // Mouse ENTRA no texto
            mainText.addEventListener('mouseenter', () => {
                backgroundImage.classList.add('theme-hover');
            });

            // Mouse SAI do texto
            mainText.addEventListener('mouseleave', () => {
                backgroundImage.classList.remove('theme-hover');
            });

            // --- 4. EVENTO DO BOTÃO DE PLAY/PAUSE (MODIFICADO PARA NÃO REDIRECIONAR) ---
            musicButton.addEventListener('click', () => {
                if (playerReady && player && player.getPlayerState) {
                    const state = player.getPlayerState();
                    if (state == YT.PlayerState.PLAYING || state == YT.PlayerState.BUFFERING) {
                        player.pauseVideo(); // Pausa
                    } else {
                        player.playVideo(); // Toca (requer interação do usuário para áudio)
                    }
                } else {
                    // Em vez de redirecionar, mostra um aviso e tenta recarregar o player
                    // (Opcional: você pode remover isso e só logar no console)
                    console.warn('Player não está pronto. Aguardando carregamento...');
                    updateStatus('Carregando player... Clique novamente em breve.');
                    
                    // Tenta forçar o recarregamento do player se possível (mas evite loops)
                    if (!playerReady) {
                        // Pequeno delay para dar tempo ao API carregar
                        setTimeout(() => {
                            if (window.YT && YT.Player) {
                                // Recria o player se a API estiver disponível
                                if (document.getElementById('youtube-player')) {
                                    document.getElementById('youtube-player').innerHTML = ''; // Limpa iframe antigo
                                }
                                window.onYouTubeIframeAPIReady(); // Chama novamente
                            }
                        }, 1000);
                    }
                }
            });

            // --- 5. VERIFICAÇÃO ADICIONAL: Se o player não carregar em 10s, avisa ---
            setTimeout(() => {
                if (!playerReady) {
                    updateStatus('Falha no carregamento. Verifique sua conexão ou adblocker.');
                }
            }, 10000);
        });
    </script>

</body>
</html>
