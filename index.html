<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loquesiento</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">

    <style>
        /* CSS - Estilização e Animações */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Container para o Parallax (Base) */
        #background-container {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            z-index: -1;
            overflow: hidden;
        }
        
        /* A imagem real dentro do container - TEMA PADRÃO (ORIGINAL) */
        #background-image {
            width: 100%;
            height: 100%;
            background-image: url('https://xatimg.com/image/u1KlkAc0rjf1.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            filter: none; 
            transition: transform 0.2s ease-out, background-image 0.2s ease-in-out, filter 0.2s ease-in-out;
        }

        /* Classe para o TEMA HOVER (ULTIMA IMAGEM) */
        .theme-hover {
            /* A imagem mais recente que aparece ao passar o mouse */
            background-image: url('https://xatimg.com/image/H0Pg9bpiICuN.png') !important;
            filter: none !important;
        }
        
        .main-text {
            font-family: 'Pirata One', cursive;
            font-size: 13.5vw; 
            color: #62d44f; 
            cursor: pointer;
            user-select: none;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 0, 0, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        .particle {
            position: absolute;
            width: 50px;
            height: auto;
            pointer-events: none;
            z-index: 100;
            animation: explode 1.2s ease-out forwards;
        }

        /* Animação de flutuação para o texto */
        @keyframes float {
            0% { transform: translateY(0px) rotateZ(0deg); }
            50% { transform: translateY(-20px) rotateZ(1.5deg); }
            100% { transform: translateY(0px) rotateZ(0deg); }
        }

        /* Animação de explosão para as partículas */
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { 
                transform: translate(var(--tx), var(--ty)) scale(0); 
                opacity: 0; 
            }
        }

        /* Estilo para o botão de play/pause no rodapé à direita (sem miniatura visível) */
        #music-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: background 0.3s ease, transform 0.2s ease;
            color: #62d44f;
            font-size: 24px;
        }

        #music-button:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
        }

        #music-button.play::before {
            content: '▶'; /* Ícone de play */
        }

        #music-button.pause::before {
            content: '⏸'; /* Ícone de pause */
        }

        /* Player de áudio invisível (áudio-only) */
        #audio-player {
            position: absolute;
            top: -9999px; /* Fora da tela para esconder */
            left: -9999px;
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* Estilo para indicador de loading/error (opcional, escondido por padrão) */
        #player-status {
            position: fixed;
            bottom: 20px;
            right: 90px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="background-container">
        <div id="background-image"></div>
    </div>
    
    <h1 class="main-text" id="mainText">Loquesiento</h1>

    <!-- Indicador de status do player (opcional, para debug) -->
    <div id="player-status"></div>

    <!-- Botão de play/pause no rodapé à direita -->
    <button id="music-button" class="play"></button>

    <!-- Player de áudio invisível (substituindo o YouTube) -->
    <audio id="audio-player" loop preload="metadata"></audio>
    
    <script>
        // JavaScript - Interatividade (incluindo controle do player de música)

        // Função auxiliar para atualizar status (opcional, para debug)
        function updateStatus(message) {
            const statusEl = document.getElementById('player-status');
            if (message) {
                statusEl.textContent = message;
                statusEl.style.display = 'block';
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 3000);
            } else {
                statusEl.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const mainText = document.getElementById('mainText');
            const backgroundImage = document.getElementById('background-image');
            const musicButton = document.getElementById('music-button');
            const audio = document.getElementById('audio-player');
            
            // Configura o áudio com o link direto do Dropbox (adicionado ?dl=1 para download direto)
            audio.src = 'https://www.dropbox.com/scl/fi/mbzdvkjctjzemzt4uvgv2/Billie-Eilish-WILDFLOWER.mp3?dl=1';
            audio.load(); // Carrega o áudio (sem autoplay)
            
            // Eventos do áudio para atualizar o botão
            audio.addEventListener('play', () => {
                musicButton.classList.remove('play');
                musicButton.classList.add('pause');
                updateStatus(''); // Limpa status
            });
            
            audio.addEventListener('pause', () => {
                musicButton.classList.remove('pause');
                musicButton.classList.add('play');
                updateStatus(''); // Limpa status
            });
            
            audio.addEventListener('ended', () => {
                // Com loop=true, isso não deve disparar, mas caso precise resetar
                musicButton.classList.remove('pause');
                musicButton.classList.add('play');
            });
            
            audio.addEventListener('error', (e) => {
                console.error('Erro no áudio:', e);
                updateStatus('Erro ao carregar o áudio. Verifique a conexão ou o link do arquivo.');
            });
            
            // --- 1. EFEITO PARALLAX DO FUNDO ---
            const parallaxRange = 25; 

            window.addEventListener('mousemove', (e) => {
                const mouseX = (e.clientX / window.innerWidth) - 0.5;
                const mouseY = (e.clientY / window.innerHeight) - 0.5;
                const offsetX = -mouseX * parallaxRange;
                const offsetY = -mouseY * parallaxRange;

                backgroundImage.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            });


            // --- 2. EFEITO DE EXPLOSÃO DE PARTÍCULAS ---
            const particleImageUrl = 'https://upload.wikimedia.org/wikipedia/commons/b/bb/Blohsh.png';
            const explosionStrength = 250; 

            mainText.addEventListener('mousemove', (event) => {
                const mouseX = event.clientX; 
                const mouseY = event.clientY;

                if (Math.random() < 0.3) {
                    createParticle(mouseX, mouseY);
                }
            });
            
            function createParticle(x, y) {
                const particle = document.createElement('img');
                particle.src = particleImageUrl;
                particle.classList.add('particle');
                
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                const randomAngle = Math.random() * Math.PI * 2;
                const randomDistance = Math.random() * explosionStrength;
                
                const finalX = Math.cos(randomAngle) * randomDistance;
                const finalY = Math.sin(randomAngle) * randomDistance;

                particle.style.setProperty('--tx', `${finalX}px`);
                particle.style.setProperty('--ty', `${finalY}px`);
                document.body.appendChild(particle);

                particle.addEventListener('animationend', () => {
                    particle.remove();
                });
            }
            
            
            // --- 3. TROCA DE TEMA AO PASSAR O MOUSE ---
            
            // Mouse ENTRA no texto
            mainText.addEventListener('mouseenter', () => {
                backgroundImage.classList.add('theme-hover');
            });

            // Mouse SAI do texto
            mainText.addEventListener('mouseleave', () => {
                backgroundImage.classList.remove('theme-hover');
            });

            // --- 4. EVENTO DO BOTÃO DE PLAY/PAUSE (AGORA USANDO HTML5 AUDIO - SEM AUTOPLAY) ---
            musicButton.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play().catch((error) => {
                        console.error('Erro ao reproduzir áudio:', error);
                        updateStatus('Erro ao reproduzir. Verifique permissões de áudio no navegador.');
                    });
                } else {
                    audio.pause();
                }
            });

            // --- 5. VERIFICAÇÃO ADICIONAL: Se o áudio não carregar em 10s, avisa ---
            setTimeout(() => {
                if (audio.readyState === 0) {
                    updateStatus('Falha no carregamento do áudio. Verifique sua conexão.');
                }
            }, 10000);
        });
    </script>

</body>
</html>
