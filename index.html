<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loquesiento</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">

    <style>
        /* CSS - Estilização e Animações */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Container para o Parallax (Base) */
        #background-container {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            z-index: -1;
            overflow: hidden;
        }
        
        /* A imagem real dentro do container - TEMA PADRÃO (ORIGINAL) */
        #background-image {
            width: 100%;
            height: 100%;
            background-image: url('https://xatimg.com/image/u1KlkAc0rjf1.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            filter: none; 
            transition: transform 0.2s ease-out, background-image 0.2s ease-in-out, filter 0.2s ease-in-out;
        }

        /* Classe para o TEMA HOVER (ULTIMA IMAGEM) */
        .theme-hover {
            /* A imagem mais recente que aparece ao passar o mouse */
            background-image: url('https://xatimg.com/image/H0Pg9bpiICuN.png') !important;
            filter: none !important;
        }
        
        .main-text {
            font-family: 'Pirata One', cursive;
            font-size: 13.5vw; 
            color: #62d44f; 
            cursor: pointer;
            user-select: none;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 0, 0, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        .particle {
            position: absolute;
            width: 50px;
            height: auto;
            pointer-events: none;
            z-index: 100;
            animation: explode 1.2s ease-out forwards;
        }

        /* Animação de flutuação para o texto */
        @keyframes float {
            0% { transform: translateY(0px) rotateZ(0deg); }
            50% { transform: translateY(-20px) rotateZ(1.5deg); }
            100% { transform: translateY(0px) rotateZ(0deg); }
        }

        /* Animação de explosão para as partículas */
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { 
                transform: translate(var(--tx), var(--ty)) scale(0); 
                opacity: 0; 
            }
        }

        /* Estilo para o botão de play/pause no rodapé à direita (sem miniatura visível) */
        #music-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: background 0.3s ease, transform 0.2s ease;
            color: #62d44f;
            font-size: 24px;
        }

        #music-button:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
        }

        #music-button.play::before {
            content: '▶'; /* Ícone de play */
        }

        #music-button.pause::before {
            content: '⏸'; /* Ícone de pause */
        }

        /* Player invisível (áudio-only, sem vídeo/miniatura) */
        #youtube-player {
            position: absolute;
            top: -9999px; /* Fora da tela para esconder */
            left: -9999px;
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="background-container">
        <div id="background-image"></div>
    </div>
    
    <h1 class="main-text" id="mainText">Loquesiento</h1>

    <!-- Botão de play/pause no rodapé à direita -->
    <button id="music-button" class="play"></button>

    <!-- Player do YouTube invisível (áudio-only) -->
    <div id="youtube-player"></div>
    
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // JavaScript - Interatividade (incluindo controle do player de música)

        let player; // Variável global para o player do YouTube

        document.addEventListener('DOMContentLoaded', () => {

            const mainText = document.getElementById('mainText');
            const backgroundImage = document.getElementById('background-image');
            const musicButton = document.getElementById('music-button');
            
            // --- 1. EFEITO PARALLAX DO FUNDO ---
            const parallaxRange = 25; 

            window.addEventListener('mousemove', (e) => {
                const mouseX = (e.clientX / window.innerWidth) - 0.5;
                const mouseY = (e.clientY / window.innerHeight) - 0.5;
                const offsetX = -mouseX * parallaxRange;
                const offsetY = -mouseY * parallaxRange;

                backgroundImage.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            });


            // --- 2. EFEITO DE EXPLOSÃO DE PARTÍCULAS ---
            const particleImageUrl = 'https://upload.wikimedia.org/wikipedia/commons/b/bb/Blohsh.png';
            const explosionStrength = 250; 

            mainText.addEventListener('mousemove', (event) => {
                const mouseX = event.clientX; 
                const mouseY = event.clientY;

                if (Math.random() < 0.3) {
                    createParticle(mouseX, mouseY);
                }
            });
            
            function createParticle(x, y) {
                const particle = document.createElement('img');
                particle.src = particleImageUrl;
                particle.classList.add('particle');
                
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                const randomAngle = Math.random() * Math.PI * 2;
                const randomDistance = Math.random() * explosionStrength;
                
                const finalX = Math.cos(randomAngle) * randomDistance;
                const finalY = Math.sin(randomAngle) * randomDistance;

                particle.style.setProperty('--tx', `${finalX}px`);
                particle.style.setProperty('--ty', `${finalY}px`);
                document.body.appendChild(particle);

                particle.addEventListener('animationend', () => {
                    particle.remove();
                });
            }
            
            
            // --- 3. TROCA DE TEMA AO PASSAR O MOUSE ---
            
            // Mouse ENTRA no texto
            mainText.addEventListener('mouseenter', () => {
                backgroundImage.classList.add('theme-hover');
            });

            // Mouse SAI do texto
            mainText.addEventListener('mouseleave', () => {
                backgroundImage.classList.remove('theme-hover');
            });

            // --- 4. INICIALIZAÇÃO DO PLAYER DO YOUTUBE (invisível) ---
            // Função chamada pela API do YouTube quando o script carrega
            window.onYouTubeIframeAPIReady = function() {
                player = new YT.Player('youtube-player', {
                    height: '0', // Invisível
                    width: '0',  // Invisível
                    videoId: 'l08Zw-RY__Q', // ID do vídeo
                    playerVars: {
                        'list': 'RDl08Zw-RY__Q', // Playlist
                        'start': 0, // Inicia do começo (start_radio=1 é simulado pela playlist)
                        'controls': 0, // Sem controles visíveis (já que é invisível)
                        'modestbranding': 1,
                        'rel': 0,
                        'showinfo': 0,
                        'iv_load_policy': 3,
                        'enablejsapi': 1,
                        'playsinline': 1, // Para mobile
                        'autoplay': 0 // Não autoplay inicial
                    },
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            };

            function onPlayerReady(event) {
                // Player pronto, mas não inicia automaticamente
                console.log('Player pronto');
            }

            function onPlayerStateChange(event) {
                // Atualiza o botão baseado no estado do player
                if (event.data == YT.PlayerState.PLAYING) {
                    musicButton.classList.remove('play');
                    musicButton.classList.add('pause');
                } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                    musicButton.classList.remove('pause');
                    musicButton.classList.add('play');
                }
            }

            // --- 5. EVENTO DO BOTÃO DE PLAY/PAUSE ---
            musicButton.addEventListener('click', () => {
                if (player && player.getPlayerState) {
                    const state = player.getPlayerState();
                    if (state == YT.PlayerState.PLAYING || state == YT.PlayerState.BUFFERING) {
                        player.pauseVideo(); // Pausa
                    } else {
                        player.playVideo(); // Toca (requer interação do usuário para áudio)
                    }
                } else {
                    // Fallback: se o player não carregou, abre o link no YouTube
                    window.open('https://www.youtube.com/watch?v=l08Zw-RY__Q&list=RDl08Zw-RY__Q&start_radio=1', '_blank');
                }
            });

        });
    </script>

</body>
</html>
